<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="2026년 컴활 2급 기출 경향 기반 객관식 연습문제" />
    <title>컴활 기출형 문제 | BWR Study</title>
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body class="tool-page">
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>
    <header class="topbar">
      <a class="wordmark" href="../../"><span>BWR</span><strong>STUDY</strong></a>
      <nav class="breadcrumbs" aria-label="현재 위치"><a href="../../">Study</a><span>/</span><a href="../">컴활</a><span>/</span><strong>기출형 문제</strong></nav>
    </header>
    <main class="tool-shell" id="main">
      <div class="tool-heading">
        <div><p class="page-kicker">PAST-EXAM STYLE · PRACTICE</p><h1>기출의 흐름으로.</h1></div>
        <p>2026 상시 02·03에 등장한 핵심 주제를 바탕으로 새로 만든 문제입니다. 원문 기출은 재배포하지 않습니다.</p>
      </div>

      <section class="quiz-setup" aria-label="문제 세트 설정">
        <label>문제 구분<select id="sourceSelect"><option value="all">2026 통합 경향</option><option value="set02">상시 02 경향</option><option value="set03">상시 03 경향</option><option value="wrong">저장된 오답만</option></select></label>
        <label>과목<select id="subjectSelect"><option value="all">전체 과목</option><option value="computer">1과목 컴퓨터 일반</option><option value="spreadsheet">2과목 스프레드시트 일반</option></select></label>
        <label>문항 수<select id="countSelect"><option value="10">무작위 10문제</option><option value="20">무작위 20문제</option><option value="all">선택 범위 전체</option></select></label>
        <button class="primary-action" id="startQuiz" type="button">학습 시작</button>
      </section>

      <section class="quiz-stage" id="quizStage" hidden aria-live="polite">
        <div class="quiz-status"><span id="questionPosition">1 / 10</span><strong id="timer">10:00</strong></div>
        <p class="question-source" id="questionSource"></p>
        <h2 class="question-title" id="questionTitle"></h2>
        <div class="answers" id="answers"></div>
        <div class="explanation" id="explanation" hidden></div>
        <div class="note-editor" id="noteEditor" hidden>
          <label for="userExplanation">내 해설 · 학습 메모</label>
          <textarea id="userExplanation" rows="4" placeholder="왜 이 답이 맞는지, 내가 틀린 이유나 외울 포인트를 적어보세요."></textarea>
          <div><button id="saveExplanation" type="button">내 해설 저장</button><span id="noteStatus" aria-live="polite"></span></div>
        </div>
        <div class="quiz-nav"><button id="quitQuiz" type="button">학습 종료</button><button id="nextQuestion" type="button" disabled>다음 문제 →</button></div>
      </section>

      <section class="result-panel" id="resultPanel" hidden>
        <p>RESULT</p><div class="result-score" id="resultScore">0 / 10</div><p id="resultMessage"></p><button id="restartQuiz" type="button">다시 풀기</button>
      </section>
    </main>
    <footer class="site-footer"><p>기출 주제 기반 창작 연습문제 · 24문항</p><a href="../">컴활 학습실로 돌아가기</a></footer>
    <script src="./app.js" defer></script>
  </body>
</html>
