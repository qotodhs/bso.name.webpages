<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="브라우저에서 도는 쿠버네티스 실습 환경 — 터미널에 kubectl 을 직접 치고 클러스터 상태로 채점받는 CKA·CKAD 랩" />
  <title>CKA · CKAD 실습실 | bso.name</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./lab.css" />
</head>
<body>
  <header class="lab-top">
    <div class="top-left">
      <a class="brand" href="../">bso.name/study/IT/k8s</a>
      <span class="path">/lab</span>
    </div>
    <div class="top-mid">
      <label class="field">
        <span>랩</span>
        <select id="labSelect"></select>
      </label>
      <span class="ctx" id="ctxLabel">k8s-c1 · default</span>
    </div>
    <div class="top-right">
      <span class="timer" id="timer">20:00</span>
      <button id="gradeButton" class="btn primary" type="button">채점</button>
      <button id="resetButton" class="btn ghost" type="button">랩 초기화</button>
      <a class="btn ghost" href="../notes/" target="_blank" rel="noopener">노트 ↗</a>
    </div>
  </header>

  <main class="lab-grid">
    <section class="pane tasks-pane" aria-label="과제">
      <div class="pane-head">
        <h1 id="labTitle">랩</h1>
        <span class="score" id="scoreLabel">0 / 0</span>
      </div>
      <p class="intro" id="labIntro"></p>
      <ol class="task-list" id="taskList"></ol>
      <div class="pane-foot">
        <p id="gradeSummary" class="grade-summary">채점을 누르면 클러스터 상태를 직접 검사합니다.</p>
      </div>
    </section>

    <section class="pane term-pane" aria-label="터미널">
      <div class="pane-head">
        <h2>terminal</h2>
        <div class="head-actions">
          <button id="docsButton" class="btn tiny" type="button">공식 문서 ↗</button>
          <button id="clearButton" class="btn tiny" type="button">clear</button>
        </div>
      </div>
      <div class="term-shell" id="termShell">
        <div class="term-out" id="termOut"></div>
        <div class="term-input-row">
          <span class="ps1" id="ps1">root@controlplane:~$</span>
          <input id="termIn" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
        </div>
      </div>
    </section>

    <section class="pane editor-pane" aria-label="편집기">
      <div class="pane-head">
        <h2 id="editorName">편집기</h2>
        <div class="head-actions">
          <select id="fileSelect" class="file-select"></select>
          <button id="saveButton" class="btn tiny primary" type="button">저장</button>
        </div>
      </div>
      <textarea id="editor" class="editor" spellcheck="false" placeholder="터미널에서 vi <파일> 또는 kubectl edit <리소스> <이름> 으로 열립니다.
여기서 직접 새 파일을 쓸 수도 있습니다 — 저장하면 파일 이름을 물어봅니다."></textarea>
      <p class="editor-hint">Tab = 공백 2칸 · Ctrl/⌘+S 저장 · YAML 은 탭 문자를 허용하지 않습니다</p>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="../vendor/js-yaml.min.js"></script>
  <script src="../docs.js"></script>
  <script src="./cluster.js"></script>
  <script src="./kubectl.js"></script>
  <script src="./shell.js"></script>
  <script src="./terminal.js"></script>
  <script src="./labs.js"></script>
  <script src="./app.js"></script>
</body>
</html>
