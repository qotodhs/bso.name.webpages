<circle cx="441.5" cy="289" r="5" fill="#1e293b"/>
<text x="56" y="50" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">가로 = 온도만 변함(현열) · 세로 = 수분만 변함(잠열)</text>
<text x="56" y="68" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">냉각은 포화곡선(노점)에 닿으면 수평으로 더 못 가고 감습이 시작된다</text>
