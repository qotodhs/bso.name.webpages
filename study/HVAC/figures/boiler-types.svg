<text x="283" y="904" font-size="11" fill="#ea580c">섹션 사이로</text>
<text x="283" y="918" font-size="11" fill="#ea580c">연소가스</text>
<text x="20" y="978" font-size="12" fill="#1e293b">주철 섹션을 조립 — 반입·증설 쉬움, 부식에 강함</text>
<text x="20" y="994" font-size="12" fill="#64748b">강도가 약해 저압 소규모용(고압 부적합)</text>
<rect x="338" y="778" width="320" height="230" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<text x="350" y="800" font-size="15" fill="#1e293b" font-weight="700">가르는 기준</text>
<text x="352" y="828" font-size="13" fill="#1e293b" font-weight="700">물이 큰 동체에</text>
<text x="352" y="849" font-size="12" fill="#64748b">  입형 · 노통 · 연관 · 노통연관 (원통형)</text>
<text x="352" y="870" font-size="12" fill="#64748b">  보유수량 많음 → 부하변동에 안정, 예열 느림</text>
<text x="352" y="891" font-size="13" fill="#1e293b" font-weight="700">물이 가는 관 안에</text>
<text x="352" y="912" font-size="12" fill="#64748b">  수관 · 관류</text>
<text x="352" y="933" font-size="12" fill="#64748b">  보유수량 적음 → 증기 발생 빠름, 고압, 수처리 엄격</text>
<text x="352" y="954" font-size="13" fill="#1e293b" font-weight="700">가스가 지나는 관이 가늘고 많을수록</text>
<text x="352" y="975" font-size="12" fill="#64748b">  전열면적↑ 효율↑ — 대신 청소가 어렵다(연관)</text>
